    /* しくみと使いかたの図（SVG）。色はページの紫にそろえる */
    figure.diagram {
      margin: 20px 0;
      text-align: center;
      --card: #ffffff;
      --line: #c9cdf2;
      --fg: #333333;
      --muted: #666666;
      --accent: #667eea;
      --ok: #2e8b57;
      --ng: #c0392b;
    }
    figure.diagram svg.dia { width: 100%; height: auto; max-width: 680px; display: block; margin: 0 auto; }
    figure.diagram figcaption { margin-top: 8px; color: #666; font-size: 0.9rem; }
    .dia .zone { fill: #f5f6ff; stroke: var(--line); stroke-width: 1.5; }
    .dia .box { fill: var(--card); stroke: var(--accent); stroke-width: 1.5; }
    .dia .box2 { fill: #eef0ff; stroke: var(--accent); stroke-width: 1.5; }
    .dia .still { fill: #e4e4ea; stroke: #9a9aa8; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .dia .video { fill: #e6dcf2; stroke: #764ba2; stroke-width: 1.5; }
    .dia .menu { fill: #ffffff; stroke: var(--accent); stroke-width: 2; }
    .dia .chip { fill: #ffffff; stroke: var(--line); stroke-width: 1.2; }
    .dia .lane { fill: #f5f6ff; stroke: var(--accent); stroke-width: 1.2; }
    .dia .funnel { fill: #eef0ff; stroke: var(--accent); stroke-width: 1.5; }
    .dia .tx { fill: var(--fg); font-size: 15px; }
    .dia .tx.s { font-size: 13px; fill: var(--muted); }
    .dia .tx.xs { font-size: 11px; fill: var(--fg); }
    .dia .tx.b { font-weight: bold; fill: var(--fg); }
    .dia .ar { stroke: var(--accent); stroke-width: 2; fill: none; }
    .dia .ar.thin { stroke-width: 1; stroke-opacity: 0.6; }
    .dia .ar.dash { stroke-dasharray: 5 4; stroke: var(--ng); }
    .dia .ahead { fill: var(--accent); }
    .dia .okc { fill: var(--ok); }
    .dia .ngc { fill: var(--ng); }
    .dia .okt, .dia .ngt { fill: #ffffff; font-size: 15px; font-weight: bold; }
    .dia .numc { fill: var(--accent); }
    .dia .numt { fill: #ffffff; font-size: 15px; font-weight: bold; }

    @media (max-width: 480px) {

<body>
  <header>
    <h1>呼び名</h1>
  </header>

  <div class="container">
    <main>
<p>気になる人に、自分だけの呼び名を付けられます。</p>
<ul><li>
コメントの行のメニューから「呼び名を付ける…」を選びます。付けると、名前の代わりに呼び名で出ます（呼び名の印が付きます）
</li><li>
呼び名は、このパソコンの中だけのものです。相手にも、ほかの人にも見えません
</li><li>
付けた呼び名は、設定の「呼び名」の欄で、まとめて見たり消したりできます
</li><li>
名前（@ではじまる名前）を変えた人には、変わったことが分かる印が付きます。前と同じ人だと分かります
</li></ul>
